name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  regression:
    name: Build and regression (JDK 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build
        run: make -C src

      - name: Regression
        run: make -C tests

      # Annotates the tests that did not pass; it also runs when the regression failed.
      - name: Report test results
        if: ${{ !cancelled() }}
        run: bash .github/scripts/check-summary.sh tests/samples tests/issues

      - name: Upload regression logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: regression-logs
          if-no-files-found: warn
          path: |
            tests/*/summary.log
            tests/**/run.log
            tests/**/result.log
            tests/**/diff.log
