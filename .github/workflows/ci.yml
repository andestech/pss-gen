name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  regression:
    name: Build and regression (JDK 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build
        run: make -C src

      - name: Regression (samples)
        run: make -C samples

      - name: Regression (issue)
        run: make -C issue

      # "make" exits 0 even when tests fail; this step turns the summaries into the job status.
      - name: Fail if any test did not pass
        run: bash .github/scripts/check-summary.sh samples issue

      - name: Upload regression logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: regression-logs
          if-no-files-found: warn
          path: |
            samples/summary.log
            issue/summary.log
            samples/**/run.log
            samples/**/result.log
            samples/**/diff.log
            issue/**/run.log
            issue/**/result.log
            issue/**/diff.log
