name: Release check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Release rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Actions are pinned to full commit SHAs, because a tag can be moved to other
    # code; the comment names the release the SHA belongs to.
    steps:
      # Full history and tags: the issue range is previous-tag..head.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release/release.py check --pr-event "$GITHUB_EVENT_PATH"

  build-test:
    name: Release build and regression (JDK 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build
        run: make -C src

      - name: Regression
        run: make -C tests

      - name: Report test results
        if: ${{ !cancelled() }}
        run: bash .github/scripts/check-summary.sh tests/samples tests/issues tests/cli tests/errors

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: make -C src unit-test

      - name: Release script tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s .github/scripts/release -p 'test_*.py' -v

      - name: Compare flow self-test
        if: ${{ !cancelled() }}
        run: bash tests/compare-test/run.sh

      - name: Upload regression logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-logs
          if-no-files-found: warn
          overwrite: true
          path: |
            tests/*/summary.log
            tests/**/run.log
            tests/**/result.log
            tests/**/diff.log
            build/reports/tests/
            build/test-results/

  # The comparison is information for the reviewer, not a gate.
  compare:
    name: Version comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build
        run: make -C src

      - name: Compare with the previous release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(python3 .github/scripts/release/release.py previous-tag "$BASE_SHA")
          make -C tests compare BASE="$base"

      - name: Add the report to the summary
        if: ${{ !cancelled() }}
        run: |
          report=$(find build/compare -name report.md | head -n 1)
          if [ -n "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-compare
          if-no-files-found: warn
          overwrite: true
          path: build/compare/
